name: Core Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    name: Python 3.10
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install lint dependency
        run: python -m pip install ruff

      - name: Compile Python sources
        run: python -m compileall -q blender_asset_pipeline tests

      - name: Run Ruff
        run: ruff check .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
